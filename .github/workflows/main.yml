name: Deploy Surgiciss
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/configure-pages@v4
      - run: npm install
      - run: npm run build
      - run: |
          echo "Checking build outputs..."
          ls -la
          ls -la dist || echo "no dist"
          ls -la dist/client || echo "no dist/client"
          ls -la.output || echo "no.output"
          ls -la.output/public || echo "no.output/public"
      - run: |
          if [ -d ".output/public" ]; then cp -r.output/public./site;
          elif [ -d "dist/client" ]; then cp -r dist/client./site;
          elif [ -d "dist" ]; then cp -r dist./site;
          else echo "BUILD FAILED - no output folder" && exit 1; fi
          ls -la./site
      - uses: actions/upload-pages-artifact@v3
        with:
          path:./site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
